name: Release — Multi-Platform Binaries, C-ABI Libraries, WASI & Packages

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.0.0)"
        required: false
        default: "v1.0.0"

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-platform-binaries:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            archive: tar.gz
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            archive: tar.gz
          - target: x86_64-apple-darwin
            os: macos-14
            archive: tar.gz
          - target: aarch64-apple-darwin
            os: macos-14
            archive: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip
          - target: aarch64-pc-windows-msvc
            os: windows-latest
            archive: zip
          - target: wasm32-wasip1
            os: ubuntu-latest
            archive: tar.gz

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain for ${{ matrix.target }}
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux cross-compilers (musl & aarch64)
        if: runner.os == 'Linux' && matrix.target != 'x86_64-unknown-linux-gnu' && matrix.target != 'wasm32-wasip1'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools gcc-aarch64-linux-gnu

      - name: Compile release artifacts for ${{ matrix.target }}
        shell: bash
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: aarch64-linux-gnu-gcc
        run: |
          if [ "${{ matrix.target }}" = "wasm32-wasip1" ] || [[ "${{ matrix.target }}" == *"-musl" ]]; then
            cargo build --release --bin ogma --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi

      - name: Package platform distribution bundle (ogma-${{ matrix.target }})
        shell: bash
        run: |
          STAGE="ogma-v1.0.0-${{ matrix.target }}"
          mkdir -p "$STAGE/include" "$STAGE/lib" "$STAGE/bin" "$STAGE/python" "$STAGE/docs"
          cp include/ogma_engine.h "$STAGE/include/"
          cp ogma_sdk.py "$STAGE/python/"
          cp README.md LICENSE-MIT LICENSE-APACHE "$STAGE/"
          cp docs/*.md "$STAGE/docs/"

          REL_DIR="target/${{ matrix.target }}/release"
          for bin_file in "$REL_DIR/ogma" "$REL_DIR/ogma.exe" "$REL_DIR/ogma.wasm"; do
            [ -f "$bin_file" ] && cp "$bin_file" "$STAGE/bin/"
          done
          for lib_file in "$REL_DIR/libogma_engine.so" "$REL_DIR/libogma_engine.dylib" "$REL_DIR/libogma_engine.a" "$REL_DIR/ogma_engine.dll" "$REL_DIR/ogma_engine.dll.lib"; do
            [ -f "$lib_file" ] && cp "$lib_file" "$STAGE/lib/"
          done

          mkdir -p dist
          if [ "${{ matrix.archive }}" = "zip" ]; then
            7z a -tzip "dist/${STAGE}.zip" "$STAGE"
          else
            tar -czf "dist/${STAGE}.tar.gz" "$STAGE"
          fi

      - name: Upload platform release artifact
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.target }}
          path: dist/*

  build-macos-universal2:
    name: Build (universal2-apple-darwin Fat Binary & Dylib)
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust with x86_64 and aarch64 macOS targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin

      - name: Build and lipo merge Universal2 macOS binary and dylib
        run: |
          cargo build --release --target x86_64-apple-darwin
          cargo build --release --target aarch64-apple-darwin
          STAGE="ogma-v1.0.0-universal2-apple-darwin"
          mkdir -p "$STAGE/bin" "$STAGE/lib" "$STAGE/include" "$STAGE/python" "$STAGE/docs" dist
          lipo -create -output "$STAGE/bin/ogma" \
            target/x86_64-apple-darwin/release/ogma \
            target/aarch64-apple-darwin/release/ogma
          lipo -create -output "$STAGE/lib/libogma_engine.dylib" \
            target/x86_64-apple-darwin/release/libogma_engine.dylib \
            target/aarch64-apple-darwin/release/libogma_engine.dylib
          cp include/ogma_engine.h "$STAGE/include/"
          cp ogma_sdk.py "$STAGE/python/"
          cp README.md LICENSE-MIT LICENSE-APACHE "$STAGE/"
          cp docs/*.md "$STAGE/docs/"
          tar -czf "dist/${STAGE}.tar.gz" "$STAGE"

      - name: Upload macOS Universal2 artifact
        uses: actions/upload-artifact@v4
        with:
          name: binary-universal2-apple-darwin
          path: dist/*

  build-python-wheels:
    name: Build Python Wheel & Source Distribution
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build wheel and sdist
        run: |
          pip install build
          python -m build --outdir dist/

      - name: Upload Python wheel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/*

  publish-github-release:
    name: Checksum, Attest SLSA Provenance & Publish v1.0.0 GitHub Release
    needs: [build-platform-binaries, build-macos-universal2, build-python-wheels]
    runs-on: ubuntu-latest
    steps:
      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate SHA256SUMS.txt and SHA512SUMS.txt
        working-directory: release-assets
        run: |
          sha256sum * > SHA256SUMS.txt
          sha512sum * > SHA512SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish GitHub Release v1.0.0 with all platform binaries
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "Ogma (ogma-rs) v1.0.0 — 30-D Human Writing Shape Engine"
          files: release-assets/*
          generate_release_notes: true
          fail_on_unmatched_files: true
